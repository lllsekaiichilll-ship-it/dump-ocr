<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body { font-family:sans-serif; text-align:center; background:#111; color:white; }
video { width:100%; border:3px solid white; }
button { font-size:28px; padding:18px 40px; margin:12px; }
#num { font-size:54px; color:#00ff66; }
#status { font-size:22px; color:#ffd966; }
</style>
</head>
<body>

<h2>ダンプOCR</h2>
<video id="video" autoplay playsinline muted></video>

<div>読取番号</div>
<div id="num">----</div>
<div id="status">待機中</div>

<button onclick="startSystem()">開始</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxm6fnx90TUsu35y574v1I4in2eav2alXiNiqV1MAp4Sje3Rx-v6oz-Q5wWtBqrHTE/exec";

let working = false;
let timer = null;
let lastSeen = {};
let cameraStarted = false;

const SAME_NUMBER_WAIT = 60000; // 同じ番号は60秒以内なら記録しない

async function startSystem() {
  document.getElementById("status").innerText = "開始中...";

  if (!cameraStarted) {
    await startCamera();
  }

  setTimeout(() => {
    startOCR();
  }, 1500);
}

async function startCamera() {
  try {
    document.getElementById("status").innerText = "カメラ起動中...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();

    cameraStarted = true;
    document.getElementById("status").innerText = "カメラ接続成功";
  } catch(e) {
    document.getElementById("status").innerText = "カメラエラー: " + e.message;
    cameraStarted = false;
  }
}

function startOCR() {
  if (timer) {
    document.getElementById("status").innerText = "すでに自動読取中";
    return;
  }

  document.getElementById("status").innerText = "自動読取中";
  readNumber();
  timer = setInterval(readNumber, 5000);
}

async function readNumber() {
  if (working) return;
  working = true;

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");

  if (!video.videoWidth) {
    document.getElementById("status").innerText = "カメラ映像待ち";
    working = false;
    return;
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  // ナンバーが「やや下」に映る設定
  const sx = vw * 0.00;
const sy = vh * 0.25;
const sw = vw * 1.00;
const sh = vh * 0.60;
  canvas.width = sw;
  canvas.height = sh;

  canvas.width = 900;
canvas.height = 300;

const ctx = canvas.getContext("2d");

// ナンバー付近を拡大して描画
ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

// 白黒・コントラスト強調
let img = ctx.getImageData(0, 0, canvas.width, canvas.height);
let data = img.data;

for (let i = 0; i < data.length; i += 4) {
  let gray = data[i] * 0.3 + data[i+1] * 0.59 + data[i+2] * 0.11;

  // コントラスト強調
  gray = gray > 130 ? 255 : 0;

  data[i] = gray;
  data[i+1] = gray;
  data[i+2] = gray;
}

ctx.putImageData(img, 0, 0);

  document.getElementById("status").innerText = "OCR読取中...";

  try {
    const imageBase64 = canvas.toDataURL("image/jpeg").split(",")[1];

const response = await fetch(
  "https://vision.googleapis.com/v1/images:annotate?key=AIzaSyDrJk1XsdVdH0gIZ4kVEkcX_JwlGhSvj5k",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      requests: [{
        image: {
          content: imageBase64
        },
        features: [{
          type: "TEXT_DETECTION"
        }]
      }]
    })
  }
);

const data = await response.json();
console.log(data);

document.getElementById("status").innerText =
JSON.stringify(data);

return;
console.log(data);

document.getElementById("status").innerText =
  JSON.stringify(data);

console.log(text);
document.getElementById("status").innerText = "OCR結果: " + text;
const match =
  text.replace(/\s/g, "").match(/\d{4}/);
    if (!match) {
      document.getElementById("status").innerText = "4桁なし";
      working = false;
      return;
    }

    const number = match[0];
    document.getElementById("num").innerText = number;

    const now = Date.now();
    const last = lastSeen[number] || 0;

    if (now - last < SAME_NUMBER_WAIT) {
      document.getElementById("status").innerText = number + " は60秒以内なので記録しません";
      working = false;
      return;
    }

    lastSeen[number] = now;

    const imageData = canvas.toDataURL("image/jpeg", 0.7);

    fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        number: number,
        image: imageData
      })
    });

    document.getElementById("status").innerText = number + " を記録しました";

  } catch(e) {
    document.getElementById("status").innerText = "OCRエラー: " + e.message;
  }

  working = false;
}
</script>

</body>
</html>
