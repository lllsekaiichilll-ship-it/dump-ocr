<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body { font-family:sans-serif; text-align:center; background:#111; color:white; }
video { width:100%; border:3px solid white; }
button { font-size:24px; padding:15px; margin:10px; }
#num { font-size:50px; color:#00ff66; }
#status { font-size:22px; color:#ffd966; }
</style>
</head>
<body>

<h2>ダンプOCR</h2>
<video id="video" autoplay playsinline muted></video>

<div>読取番号</div>
<div id="num">----</div>
<div id="status">待機中</div>

<button onclick="startCamera()">カメラ開始</button>
<button onclick="startOCR()">自動読取開始</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let lastNumber = "";
let working = false;
let timer = null;

async function startCamera() {
  try {
    document.getElementById("status").innerText = "カメラ起動中...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();

    document.getElementById("status").innerText = "カメラ接続成功";
  } catch(e) {
    document.getElementById("status").innerText = "カメラエラー: " + e.name + " / " + e.message;
    alert("カメラエラー: " + e.name + " / " + e.message);
  }
}

function startOCR() {
  if (timer) return;
  document.getElementById("status").innerText = "自動読取中";
  readNumber();
  timer = setInterval(readNumber, 8000);
}

async function readNumber() {
  if (working) return;
  working = true;

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");

  if (!video.videoWidth) {
    document.getElementById("status").innerText = "カメラ映像待ち";
    working = false;
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  const vw = video.videoWidth;
const vh = video.videoHeight;

// 画面の中央〜やや下だけを切り取り
const sx = vw * 0.15;
const sy = vh * 0.45;
const sw = vw * 0.70;
const sh = vh * 0.35;

canvas.width = sw;
canvas.height = sh;

ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

  document.getElementById("status").innerText = "OCR読取中...";

  try {
    const result = await Tesseract.recognize(canvas, "eng");
    const text = result.data.text;
    const clean = text.replace(/\s/g, "");
    const match = clean.match(/\d{4}/);

    if (match) {
      const number = match[0];
      document.getElementById("num").innerText = number;
      document.getElementById("status").innerText = number + " を読み取り・写真保存中";

      if (number !== lastNumber) {
        lastNumber = number;

        const imageData = canvas.toDataURL("image/jpeg", 0.7);

        fetch("https://script.google.com/macros/s/AKfycbxm6fnx90TUsu35y574v1I4in2eav2alXiNiqV1MAp4Sje3Rx-v6oz-Q5wWtBqrHTE/exec", {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            number: number,
            image: imageData
          })
        });

        document.getElementById("status").innerText = number + " を記録しました";
      } else {
        document.getElementById("status").innerText = number + " は重複のため記録しません";
      }
    } else {
      document.getElementById("status").innerText = "4桁なし";
    }
  } catch(e) {
    document.getElementById("status").innerText = "OCRエラー: " + e.message;
  }

  working = false;
}
</script>

</body>
</html>
